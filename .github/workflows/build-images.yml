name: promote-images

on:
  push:
    branches: [v2]
  workflow_dispatch:

concurrency:
  group: promote-v2-to-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v2
        uses: actions/checkout@v7
        with:
          ref: v2
          fetch-depth: 0

      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format TOML
        run: uv run tombi format --offline

      - name: Build generated artifacts
        run: uv run python scripts/build_images.py

      - name: Test
        run: uv run python -m unittest discover -s tests -v

      - name: Check whitespace
        run: git diff --check

      - name: Commit automated maintenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data \
            images.json \
            images.schema.json \
            portraits.json \
            sect-maps.json \
            schema/character.schema.json \
            schema/sect.schema.json \
            schema/theme.schema.json
          if git diff --cached --quiet; then
            echo "TOML 和生成产物无需更新"
          else
            git commit -m "chore(data): format and sync artifacts [skip ci]"
          fi

      - name: Promote v2 to main
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git fetch origin v2 main
          if [ "$(git rev-parse origin/v2)" != "$SOURCE_SHA" ]; then
            echo "::warning::v2 已在构建期间更新，由较新的任务接手晋级"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main 已与 v2 分叉，拒绝自动合并或强推"
            exit 1
          fi
          git push --atomic origin \
            HEAD:refs/heads/v2 \
            HEAD:refs/heads/main
