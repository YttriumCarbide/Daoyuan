name: promote-images

on:
  push:
    branches: [v2]
  workflow_dispatch:

concurrency:
  group: promote-v2-to-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v2
        uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 0
          # 使用具有绕过分支保护权限的 PAT (Personal Access Token)
          # 需要在 Settings -> Secrets and variables -> Actions 中添加名为 GH_PAT 的 Secret
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format TOML
        run: pnpm exec tombi format --offline

      - name: Build generated artifacts
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check whitespace
        run: git diff --check

      - name: Commit automated maintenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data \
            images.json \
            images.schema.json \
            portraits.json \
            sect-maps.json \
            schema/character.schema.json \
            schema/sect.schema.json \
            schema/theme.schema.json
          if git diff --cached --quiet; then
            echo "TOML 和生成产物无需更新"
          else
            git commit -m "chore(data): format and sync artifacts [skip ci]"
          fi

      - name: Promote v2 to main
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git fetch origin v2 main
          if [ "$(git rev-parse origin/v2)" != "$SOURCE_SHA" ]; then
            echo "::warning::v2 已在构建期间更新，由较新的任务接手晋级"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main 已与 v2 分叉，拒绝自动合并或强推"
            exit 1
          fi
          git push --atomic origin \
            HEAD:refs/heads/v2 \
            HEAD:refs/heads/main
